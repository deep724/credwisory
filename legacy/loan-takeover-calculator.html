<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Takeover Calculator | Credwisory</title><link rel="stylesheet" href="tool-pages.css"><link rel="stylesheet" href="tool-calculators-enhanced.css"></head><body><main class="tool-page"><a class="tool-crumb" href="index.html">← Back to home</a><section class="tool-hero"><p class="tool-eyebrow">LOAN TOOLS</p><h1>Loan Takeover Calculator</h1><p>Compare an illustrative current EMI with a potential new interest rate.</p></section><section class="tool-card tool-grid calculator-shell" aria-labelledby="takeover-form-title"><div class="tool-inputs"><h2 id="takeover-form-title">Compare your options</h2><label class="tool-field">Outstanding balance (₹)<input id="amount" type="number" min="1" inputmode="numeric" value="1000000"></label><label class="tool-field">Current annual rate (%)<input id="rate" type="number" min="0" step="0.01" inputmode="decimal" value="12"></label><label class="tool-field">New annual rate (%)<input id="new-rate" type="number" min="0" step="0.01" inputmode="decimal" value="10"></label><label class="tool-field">Remaining tenure (years)<input id="years" type="number" min="0.1" max="30" step="0.1" inputmode="decimal" value="8"></label><button class="tool-calculate" type="button" data-calculator-submit>Compare estimates <span aria-hidden="true">→</span></button></div><div class="tool-results" aria-live="polite"><p class="result-eyebrow">YOUR ESTIMATE</p><span>Current illustrative EMI<strong id="emi">—</strong></span><span>Potential monthly saving<strong id="interest">—</strong></span><p class="tool-note">Consider fees and lender terms before deciding on a takeover.</p></div></section></main><script src="tool-calculators.js"></script></body></html>
